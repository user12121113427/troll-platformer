<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Troll Platformer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050008;
            overflow: hidden;
            font-family: monospace;
            touch-action: none;
        }

        #game {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #08000d;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
        }

        .side {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ff4fae;
            background: rgba(20, 0, 25, 0.8);
            color: #ff8dcc;
            font-size: 30px;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        button:active {
            background: #ff4fae;
            color: #08000d;
        }
    </style>
</head>

<body>

    <canvas id="game"></canvas>

    <div id="controls">

        <div class="side">
            <button id="left">←</button>
        </div>

        <div class="side">
            <button id="right">→</button>
            <button id="jump">↑</button>
        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
