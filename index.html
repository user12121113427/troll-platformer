<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>Troll Platformer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: black;
            overflow: hidden;
            touch-action: none;
        }

        #game {
            display: block;
            width: 100vw;
            height: 56.25vw;
            max-height: 100vh;
            background: black;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 9999;
            pointer-events: none;
        }

        .control {
            width: 75px;
            height: 75px;
            border: 3px solid white;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 35px;
            pointer-events: auto;
            touch-action: none;
        }

        #jump {
            position: absolute;
            right: 120px;
        }
    </style>
</head>

<body>

<canvas id="game"></canvas>

<div id="controls">
    <button class="control" id="left">←</button>
    <button class="control" id="jump">↑</button>
    <button class="control" id="right">→</button>
</div>

<script src="game.js"></script>

</body>
</html>
